name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Post-Merge Distribution Integrity]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@ebbb35f038a7a3c7d46c12660968bcd50eb67580
    with:
      policy_source_ref: ebbb35f038a7a3c7d46c12660968bcd50eb67580
      required_main_workflow: Post-Merge Distribution Integrity
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: distribution
      distribution_evidence_artifact_name: platform-release-distribution-integrity
