name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Post-Merge Distribution Integrity]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@41c94f1ef9042059a3b2afd12c5066f65dcf0d7d
    with:
      policy_source_ref: dd02d6470f061e6e755e6fb47ae5331c34f89875
      required_main_workflow: Post-Merge Distribution Integrity
      repository_role: distribution
      distribution_evidence_artifact_name: platform-release-distribution-integrity
